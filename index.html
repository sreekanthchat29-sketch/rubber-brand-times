<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rubber Brand Times</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --accent: #f97316;
      --accent-soft: #fed7aa;
      --accent2: #22c55e;
      --accent3: #3b82f6;
      --text: #e5e7eb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .shell {
      width: 100%;
      max-width: 1200px;
      background: linear-gradient(135deg, #0b1120, #020617);
      border-radius: 24px;
      padding: 2px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.65);
      position: relative;
      overflow: hidden;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: -200px;
      background:
        radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.28), transparent 60%),
        radial-gradient(circle at 80% 10%, rgba(59, 130, 246, 0.32), transparent 55%),
        radial-gradient(circle at 20% 80%, rgba(244, 114, 182, 0.25), transparent 55%);
      opacity: 0.9;
      z-index: -1;
      filter: blur(2px);
    }
    .inner {
      background: radial-gradient(circle at top left, rgba(15,23,42,0.95), rgba(2,6,23,0.98));
      border-radius: 22px;
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 20px;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 800px) {
      .inner {
        grid-template-columns: 1fr;
      }
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      padding-bottom: 14px;
      margin-bottom: 6px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: conic-gradient(from 150deg, #f97316, #22c55e, #3b82f6, #e11d48, #f97316);
      padding: 3px;
      position: relative;
    }
    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 30%, #020617, #020617 40%, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f97316;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-shadow: 0 0 14px rgba(248, 250, 252, 0.2);
      font-size: 18px;
    }
    .title-block h1 {
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title-block p {
      font-size: 12px;
      color: #9ca3af;
    }
    .tagline {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #f9a8d4;
      background: rgba(15,23,42,0.85);
      border-radius: 999px;
      padding: 6px 14px;
      border: 1px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 0 0 1px rgba(15,23,42,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.9);
    }
    /* Login panel */
    .login-card {
      background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,0.97));
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow: 0 18px 40px rgba(15,23,42,0.75);
      padding: 16px 16px 18px;
      max-width: 320px;
      margin-left: auto;
    }
    .login-card h2 {
      font-size: 16px;
      margin-bottom: 2px;
    }
    .login-card p {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(30, 64, 175, 0.5);
      color: #bfdbfe;
      border: 1px solid rgba(191, 219, 254, 0.4);
      margin-bottom: 10px;
    }
    .pill span {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #3b82f6;
      box-shadow: 0 0 7px rgba(59,130,246,0.9);
    }
    label {
      font-size: 11px;
      color: #e5e7eb;
      display: block;
      margin-bottom: 4px;
    }
    .field {
      margin-bottom: 10px;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 8px 9px;
      border-radius: 11px;
      border: 1px solid rgba(75, 85, 99, 0.9);
      background: rgba(15,23,42,0.95);
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 1px rgba(248, 250, 252, 0.08), 0 0 15px rgba(249,115,22,0.3);
      background: rgba(15,23,42,1);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #111827;
      box-shadow:
        0 8px 25px rgba(249,115,22,0.8),
        0 0 0 1px rgba(15,23,42,0.9);
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
      margin-top: 2px;
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 12px 35px rgba(249,115,22,0.9),
        0 0 0 1px rgba(15,23,42,1);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow:
        0 4px 15px rgba(249,115,22,0.6),
        0 0 0 1px rgba(15,23,42,0.9);
    }
    .error {
      font-size: 11px;
      color: #fca5a5;
      min-height: 14px;
      margin-top: 4px;
    }
    /* Main content */
    .content {
      display: none;
      grid-column: 1 / -1;
      margin-top: 10px;
      gap: 18px;
      grid-template-columns: minmax(0, 1.3fr) minmax(260px, 1fr);
    }
    .content.visible {
      display: grid;
    }
    .section {
      background: linear-gradient(145deg, rgba(15,23,42,0.96), rgba(15,23,42,0.94));
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 12px 35px rgba(15,23,42,0.85);
      padding: 14px 14px 16px;
      position: relative;
      overflow: hidden;
    }
    .section::before {
      content: "";
      position: absolute;
      inset: -60%;
      background: radial-gradient(circle at 0% 0%, rgba(248, 250, 252, 0.04), transparent 60%);
      pointer-events: none;
    }
    .section h3 {
      font-size: 15px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      color: #9ca3af;
    }
    .items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 2px;
      max-height: 260px;
      overflow: auto;
      padding-right: 4px;
    }
    .item {
      border-radius: 12px;
      padding: 9px 10px;
      background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,1));
      border: 1px solid rgba(55,65,81,0.75);
      position: relative;
      box-shadow: 0 8px 22px rgba(15,23,42,0.75);
    }
    .item-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }
    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #e5e7eb;
    }
    .item-date {
      font-size: 11px;
      color: #9ca3af;
    }
    .item-body {
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.4;
    }
    .item-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #facc15;
      margin-top: 4px;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .pill-small {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
    }
    .pill-small.red {
      border-color: rgba(248,113,113,0.8);
      color: #fecaca;
    }
    .pill-small.blue {
      border-color: rgba(56,189,248,0.8);
      color: #bae6fd;
    }
    .pill-small.green {
      border-color: rgba(52,211,153,0.9);
      color: #bbf7d0;
    }
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(148,163,184,0.4), transparent);
      margin: 10px 0;
    }
    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .form-grid .field {
      margin-bottom: 0;
    }
    textarea {
      width: 100%;
      min-height: 70px;
      max-height: 120px;
      resize: vertical;
      padding: 8px 9px;
      border-radius: 11px;
      border: 1px solid rgba(75, 85, 99, 0.9);
      background: rgba(15,23,42,0.95);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
  </style>
</head>
<body>
  <!-- your body content, including this cleaned text: -->
  <p style="font-size:12px;color:#d1d5db;margin-bottom:8px;">
    This space is just for us: crew history, birthday shout‑outs and random chaos from the group.
  </p>

  <div style="margin-bottom:10px; display:flex; gap:8px; flex-wrap:wrap;">
    <a href="/chat.html" class="btn-secondary">
      <span class="dot"></span>
      Open crew chat
    </a>
    <a href="/call.html" class="btn-secondary">
      <span class="dot"></span>
      Join group call
    </a>
  </div>

  <div class="divider"></div>

  <button class="btn-secondary" id="clear-btn">
    CLEAR EVERYTHING ON THIS DEVICE
  </button>
</body>
</html>
