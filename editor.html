<!DOCTYPE html>
<html>
<head>
<title>Rubber Brand Times - Editor</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}#auth-screen{display:flex;justify-content:center;align-items:center;min-height:100vh}.auth-card{background:#fff;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;max-width:400px;width:100%}.auth-card h1{margin-bottom:20px;color:#333}.auth-card input{width:100%;padding:15px;margin:15px 0;border:2px solid #e0e0e0;border-radius:10px;font-size:16px}.auth-card input:focus{outline:0;border-color:#667eea}.auth-card button{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}.hint{margin-top:15px;color:#999;font-size:14px}#editor-screen{max-width:1200px;margin:0 auto}.header{background:#fff;padding:20px;border-radius:15px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 20px rgba(0,0,0,.1)}.header h1{color:#333;font-size:24px}.logout-btn{padding:10px 20px;background:#ff4757;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700}.editor-container{background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1);margin-bottom:20px}.form-group{margin-bottom:25px}.form-group label{display:block;margin-bottom:8px;color:#333;font-weight:600;font-size:14px;text-transform:uppercase}.form-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;font-family:inherit}.form-group input:focus{outline:0;border-color:#667eea}#editor{min-height:300px;background:#fff}.ql-toolbar{border-radius:8px 8px 0 0;border:2px solid #e0e0e0;border-bottom:1px solid #e0e0e0}.ql-container{border-radius:0 0 8px 8px;border:2px solid #e0e0e0;border-top:none;font-size:15px}.actions{display:flex;gap:15px;margin-top:30px}.actions button{flex:1;padding:15px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}.save-btn{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}.preview-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.export-btn{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}#preview-section{background:#fff;padding:30px;border-radius:15px;margin-top:20px;box-shadow:0 5px 20px rgba(0,0,0,.1)}#preview-section h2{margin-bottom:20px;color:#333}#preview-content{padding:20px;background:#f8f9fa;border-radius:10px;border-left:4px solid #667eea}.saved-editions{background:#fff;padding:30px;border-radius:15px;margin-top:20px;box-shadow:0 5px 20px rgba(0,0,0,.1)}.saved-editions h2{margin-bottom:20px;color:#333}.edition-item{padding:15px;background:#f8f9fa;border-radius:10px;margin-bottom:10px;border-left:4px solid #667eea;display:flex;justify-content:space-between;align-items:center}.edition-info h3{color:#333}.edition-info p{color:#666;font-size:14px}.edition-actions button{margin-left:10px;padding:8px 15px;border:none;border-radius:6px;cursor:pointer;font-weight:700}.load-btn{background:#667eea;color:#fff}.delete-btn{background:#ff4757;color:#fff}
</style>
</head>
<body>
<div id="auth-screen">
<div class="auth-card">
<h1>🔒 Editor Access</h1>
<input type="password" id="editor-password" placeholder="Enter editor password">
<button onclick="checkPassword()">Unlock Editor</button>
<p class="hint">Hint: rubbereditor2026</p>
</div>
</div>
<div id="editor-screen" style="display:none">
<div class="header">
<h1>📰 Rubber Brand Times - Editor</h1>
<button onclick="logout()" class="logout-btn">Logout</button>
</div>
<div class="editor-container">
<div class="form-group">
<label>Date</label>
<input type="date" id="edition-date">
</div>
<div class="form-group">
<label>Title</label>
<input type="text" id="edition-title" placeholder="March 12, 2026 - Kuwait Edition">
</div>
<div class="form-group">
<label>Content</label>
<div id="editor"></div>
</div>
<div class="form-group">
<label>Highlights</label>
<input type="text" id="highlights" placeholder="• Highlight 1">
</div>
<div class="actions">
<button onclick="saveEdition()" class="save-btn">💾 Save Edition</button>
<button onclick="previewEdition()" class="preview-btn">👁️ Preview</button>
<button onclick="exportHTML()" class="export-btn">📄 Export HTML</button>
</div>
</div>
<div id="preview-section" style="display:none">
<h2>Preview</h2>
<div id="preview-content"></div>
</div>
<div class="saved-editions">
<h2>Saved Editions</h2>
<div id="editions-list"></div>
</div>
</div>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
let quill=new Quill('#editor',{theme:'snow',modules:{toolbar:[['bold','italic','underline'],['blockquote','code-block'],[{header:1},{header:2}],[{list:'ordered'},{list:'bullet'}],[{indent:'-1'},{indent:'+1'}],['link','image'],['clean']]}});function checkPassword(){if(document.getElementById('editor-password').value==='rubbereditor2026'){document.getElementById('auth-screen').style.display='none';document.getElementById('editor-screen').style.display='block';loadEditions()}else{alert('Incorrect password!')}}function logout(){document.getElementById('auth-screen').style.display='flex';document.getElementById('editor-screen').style.display='none';document.getElementById('editor-password').value=''}function saveEdition(){const edition={date:document.getElementById('edition-date').value,title:document.getElementById('edition-title').value,content:quill.root.innerHTML,highlights:document.getElementById('highlights').value,saved:new Date().toLocaleString()};let editions=JSON.parse(localStorage.getItem('editions')||'[]');editions.unshift(edition);localStorage.setItem('editions',JSON.stringify(editions));alert('Edition saved!');loadEditions()}function loadEditions(){const editions=JSON.parse(localStorage.getItem('editions')||'[]');const list=document.getElementById('editions-list');list.innerHTML='';editions.forEach((ed,i)=>{list.innerHTML+=`<div class="edition-item"><div class="edition-info"><h3>${ed.title||'Untitled'}</h3><p>Saved: ${ed.saved}</p></div><div class="edition-actions"><button onclick="loadEdition(${i})" class="load-btn">Load</button><button onclick="deleteEdition(${i})" class="delete-btn">Delete</button></div></div>`})}function loadEdition(i){const editions=JSON.parse(localStorage.getItem('editions')||'[]');const ed=editions[i];document.getElementById('edition-date').value=ed.date;document.getElementById('edition-title').value=ed.title;quill.root.innerHTML=ed.content;document.getElementById('highlights').value=ed.highlights}function deleteEdition(i){if(confirm('Delete this edition?')){let editions=JSON.parse(localStorage.getItem('editions')||'[]');editions.splice(i,1);localStorage.setItem('editions',JSON.stringify(editions));loadEditions()}}function previewEdition(){document.getElementById('preview-content').innerHTML=`<h1>${document.getElementById('edition-title').value}</h1><p><em>${document.getElementById('edition-date').value}</em></p><div>${quill.root.innerHTML}</div><p><strong>Highlights:</strong> ${document.getElementById('highlights').value}</p>`;document.getElementById('preview-section').style.display='block'}function exportHTML(){const html=`<!DOCTYPE html><html><head><title>${document.getElementById('edition-title').value}</title></head><body><h1>${document.getElementById('edition-title').value}</h1><p>${document.getElementById('edition-date').value}</p>${quill.root.innerHTML}<p>${document.getElementById('highlights').value}</p></body></html>`;const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='edition.html';a.click()}
</script>
</body>
</html>
